{% extends "seller/base.html" %}
{% block title %}Shop settings | {{ site_name }}{% endblock %}
{% block seller %}
<div class="seller-page">
  <form class="card form-card wide seller-form" method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Shop settings</h1>
    <p class="muted">Changes show to customers straight away.</p>
    {% set f = vendor %}
    {% include "_shop_form.html" %}
    <button class="btn" type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
