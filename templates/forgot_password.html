{% extends "base.html" %}
{% block title %}Forgot password | {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="card form-card" method="POST">
    <a href="{{ url_for('home') }}" class="auth-logo"><img src="{{ url_for('static', filename='img/gc-logo.svg') }}" alt="Katale"></a>
    <h1 class="center">Forgot your password?</h1>
    <p class="muted center">Type your email and we'll send you a link to choose a new one.</p>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" autocomplete="email" required>
    <button class="btn" type="submit">Send reset link</button>
    <p class="muted center" style="margin-top:18px"><a class="text-link" href="{{ url_for('login') }}">Back to log in</a></p>
  </form>
</div>
{% endblock %}
