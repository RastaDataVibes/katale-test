{% extends "base.html" %}
{% block title %}Choose a new password | {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="card form-card" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <a href="{{ url_for('home') }}" class="auth-logo"><img src="{{ url_for('static', filename='img/gc-logo.svg') }}" alt="Katale"></a>
    <h1 class="center">Choose a new password</h1>
    <p class="muted center">For {{ user.email }}</p>
    <label for="password">New password</label>
    <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required>
    <p class="muted" style="margin-top:6px;font-size:13.5px">At least 8 characters.</p>
    <button class="btn" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
