{% extends "base.html" %}
{% block title %}Log in | {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="card form-card" method="POST">
    <a href="{{ url_for('home') }}" class="auth-logo"><img src="{{ url_for('static', filename='img/gc-logo.svg') }}" alt="Katale"></a>
    <h1 class="center">Welcome back</h1>
    <p class="muted center">Log in to order from shops near you.</p>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <button class="btn" type="submit">Log in</button>
    <p class="muted" style="margin-top:16px;text-align:center">New here? <a class="text-link" href="{{ url_for('register', next=request.args.get('next')) }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
